<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login Seguro - ExifRank</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f3f4f6; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        h2 { color: #1f2937; }
        p { color: #4b5563; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #btn-login { background-color: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        #btn-login:hover { background-color: #3367D6; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="title">Autenticação</h2>
        <p id="subtitle">Clique no botão abaixo para fazer login com sua conta Google com segurança.</p>
        <div id="loader" class="loader" style="display: none;"></div>
        <button id="btn-login">Continuar com Google</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyASvV-eeNbziXUjmPvv2mkpzV8Kdl7l77s",
          authDomain: "exifrankapp.firebaseapp.com",
          projectId: "exifrankapp",
          storageBucket: "exifrankapp.firebasestorage.app",
          messagingSenderId: "357347824730",
          appId: "1:357347824730:web:58fa237653cb2162b13463"
        };
        firebase.initializeApp(firebaseConfig);

        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const loginParameters = new URLSearchParams(window.location.hash.slice(1));
        const loginState = loginParameters.get('state');
        const loginMode = loginParameters.get('mode') === 'link' ? 'link' : 'signin';
        const linkingCustomToken = loginParameters.get('customToken') || '';
        const functions = firebase.functions();

        async function notifyDesktop(payload) {
            if (!loginState) throw new Error('Solicitação de login inválida. Volte ao ExifRank e tente novamente.');
            const response = await fetch('http://127.0.0.1:45321/set_auth_token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: loginState, ...payload })
            });
            if (!response.ok) {
                throw new Error('Não foi possível transferir o login para o ExifRank.');
            }
        }

        function friendlyGoogleMessage(error) {
            const code = String(error?.code || '').toLowerCase();
            const detail = String(error?.message || '').trim();
            if (code === 'auth/account-exists-with-different-credential') {
                return 'Este e-mail já possui acesso por e-mail e senha. Volte ao ExifRank, entre com sua senha e conecte o Google em Configurações.';
            }
            if (code === 'auth/credential-already-in-use') {
                return 'Esta conta Google já está conectada a outro acesso ExifRank. Entre pelo método usado nessa conta ou fale com o suporte.';
            }
            if (code === 'auth/popup-closed-by-user') {
                return 'O login foi cancelado. Quando estiver pronto, tente novamente.';
            }
            if (code === 'auth/unauthorized-domain') {
                return 'Este computador ainda não está autorizado para o login Google. Adicione 127.0.0.1 aos domínios autorizados do Firebase e tente novamente.';
            }
            if (code === 'auth/operation-not-allowed') {
                return 'O login com Google ainda não está habilitado no Firebase. Ative o provedor Google em Authentication > Sign-in method.';
            }
            if (code === 'auth/network-request-failed' || code === 'auth/timeout') {
                return 'Não foi possível conectar. Verifique sua internet e tente novamente.';
            }
            if (code === 'functions/unauthenticated') {
                return 'Não foi possível confirmar a sessão Google. Feche esta janela e tente entrar novamente.';
            }
            if (code === 'functions/failed-precondition') {
                const detail = String(error?.message || '').trim();
                return detail && detail.length <= 180 ? detail : 'A conta Google escolhida não pôde ser confirmada.';
            }
            if (code === 'functions/unavailable' || code === 'functions/deadline-exceeded') {
                return 'O serviço de login está temporariamente indisponível. Aguarde alguns segundos e tente novamente.';
            }
            if (code === 'functions/internal' || code === 'functions/unknown') {
                return 'O Google foi autenticado, mas a confirmação segura da sessão falhou. Tente novamente em alguns segundos.';
            }
            return 'Não foi possível concluir o login agora. Tente novamente.';
        }
        
        document.getElementById("btn-login").addEventListener("click", async () => {
            document.getElementById("btn-login").style.display = "none";
            document.getElementById("loader").style.display = "block";
            document.getElementById("title").innerText = "Autenticando...";

            try {
                let credential;
                if (loginMode === 'link') {
                    if (!linkingCustomToken) {
                        throw new Error('Não foi possível preparar o vínculo da conta Google.');
                    }
                    await firebase.auth().signInWithCustomToken(linkingCustomToken);
                    credential = await firebase.auth().currentUser.linkWithPopup(provider);
                } else {
                    credential = await firebase.auth().signInWithPopup(provider);
                }

                const idToken = await credential.user.getIdToken(true);
                document.getElementById("title").innerText = "Confirmando sessão...";
                const exchange = firebase.functions().httpsCallable('exchangeGoogleIdToken');
                const exchangeResult = await exchange({ idToken });
                const customToken = exchangeResult?.data?.customToken;
                if (!customToken || typeof customToken !== 'string') {
                    throw new Error('Não foi possível confirmar a sessão Google.');
                }
                document.getElementById("title").innerText = "Transferindo sessão...";
                await notifyDesktop({ customToken });
                try { await firebase.auth().signOut(); } catch (_) {}
                document.getElementById("title").innerText = "✅ Login Concluído!";
                document.getElementById("subtitle").innerText = loginMode === 'link'
                    ? "Google conectado. Você já pode voltar para o ExifRank."
                    : "Sessão validada. Você já pode fechar esta aba e voltar para o ExifRank.";
                document.getElementById("loader").style.display = "none";
                setTimeout(() => window.close(), 2000);
            } catch (e) {
                const message = friendlyGoogleMessage(e);
                try {
                    if (loginState) await notifyDesktop({ errorCode: String(e?.code || 'auth/google-login-failed') });
                } catch (_) {}
                document.getElementById("title").innerText = "Erro no Login";
                document.getElementById("subtitle").innerText = message;
                document.getElementById("loader").style.display = "none";
                document.getElementById("btn-login").style.display = "block";
            }
        });
    </script>
</body>
</html>
